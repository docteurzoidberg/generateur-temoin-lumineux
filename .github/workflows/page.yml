# Web page: checked, built and published on GitHub Pages on every push to main (Pages
# source: "GitHub Actions" in the repository settings). The page tests need Playwright's
# headless Chromium; no deployment if a test fails.
name: Page web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Contrôler et construire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22   # 22.18 or later: TypeScript run as is
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps --only-shell chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @temoin/web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    name: Publier
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
